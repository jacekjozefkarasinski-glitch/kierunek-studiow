name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]

  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Fetch Facebook posts
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        shell: bash
        run: |
          cp src/data/facebook-posts.json /tmp/facebook-posts-backup.json

          if node scripts/fetch-facebook-posts.mjs; then
            echo "Facebook posts downloaded successfully."
          else
            echo "Facebook download failed. Restoring previous posts."
            cp /tmp/facebook-posts-backup.json src/data/facebook-posts.json
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4