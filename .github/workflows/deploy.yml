name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["main"]

  schedule:
    # GitHub Actions cron działa w UTC.
    # Uruchamiamy workflow o 10:00, 11:00, 16:00, 17:00, 20:00 i 21:00 UTC,
    # a poniżej sprawdzamy czas Europe/Warsaw.
    # Dzięki temu 12:00, 18:00 i 22:00 działają poprawnie
    # zarówno w czasie letnim, jak i zimowym.
    - cron: "0 10,11,16,17,20,21 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check scheduled time
        id: schedule_check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WARSAW_HOUR=$(TZ=Europe/Warsaw date +%H)

          echo "Current Warsaw hour: $WARSAW_HOUR"

          if [[ "$WARSAW_HOUR" == "12" || "$WARSAW_HOUR" == "18" || "$WARSAW_HOUR" == "22" ]]; then
            echo "run_fetch=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_fetch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Backup Facebook archive
        if: steps.schedule_check.outputs.run_fetch == 'true'
        shell: bash
        run: |
          cp src/data/facebook-posts.json /tmp/facebook-posts-backup.json

      - name: Fetch Facebook posts
        id: facebook
        if: steps.schedule_check.outputs.run_fetch == 'true'
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: node scripts/fetch-facebook-posts.mjs

      - name: Restore archive if Facebook failed
        if: steps.schedule_check.outputs.run_fetch == 'true' && steps.facebook.outcome == 'failure'
        shell: bash
        run: |
          echo "Facebook API failed. Restoring previous archive."
          cp /tmp/facebook-posts-backup.json src/data/facebook-posts.json

      - name: Save Facebook archive
        if: steps.schedule_check.outputs.run_fetch == 'true' && steps.facebook.outcome == 'success'
        shell: bash
        run: |
          if git diff --quiet -- src/data/facebook-posts.json; then
            echo "No new Facebook posts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add src/data/facebook-posts.json
            git commit -m "Update Facebook posts [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4